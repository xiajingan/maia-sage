<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maia 内部联系人 · 交互原型</title><style>:root {
  --color-page: #edf2f7;
  --color-surface: #ffffff;
  --color-ink: #182f48;
  --color-muted: #52677d;
  --color-line: #cedae6;
  --color-action: #164f8a;
  --color-action-hover: #103e6e;
  --color-soft: #e6eff8;
  --color-success: #236449;
  --color-warning: #795010;
  --color-warning-bg: #fff5df;
  --color-danger: #973d43;
  --font-body: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-heading: "Songti SC", "STSong", serif;
  --text-small: 0.875rem;
  --text-body: 1rem;
  --text-section: 1.25rem;
  --text-title: clamp(1.8rem, 4vw, 2.75rem);
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-strong: 650;
  --space-0: 0;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --space-8: 4rem;
  --radius-control: 0.375rem;
  --radius-panel: 0.75rem;
  --radius-pill: 2rem;
  --line-thin: 1px;
  --line-accent: 4px;
  --focus-width: 3px;
  --focus-offset: 3px;
  --contacts-table-width: 54rem;
  --content-width: 70rem;
  --reading-width: 42rem;
  --control-height: 2.75rem;
  --header-height: 5rem;
  --line-body: 1.7;
  --line-heading: 1.25;
  --opacity-muted: 0.6;
  --z-skip: 10;
}

* {
  box-sizing: border-box;
}
body {
  margin: var(--space-0);
  background: var(--color-page);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: var(--line-body);
}
button,
a {
  font: inherit;
}
button {
  min-height: var(--control-height);
  padding: var(--space-2) var(--space-5);
  border: var(--line-thin) solid var(--color-line);
  border-radius: var(--radius-control);
  background: var(--color-surface);
  color: var(--color-action);
  cursor: pointer;
  font-weight: var(--weight-medium);
}
button.primary {
  background: var(--color-action);
  border-color: var(--color-action);
  color: var(--color-surface);
}
button:hover:not(:disabled) {
  border-color: var(--color-action);
}
button.primary:hover:not(:disabled) {
  background: var(--color-action-hover);
}
button:disabled {
  opacity: var(--opacity-muted);
  cursor: wait;
}
:focus-visible {
  outline: var(--focus-width) solid var(--color-action);
  outline-offset: var(--focus-offset);
}
h1,
h2,
p {
  margin: var(--space-0);
}
h1 {
  font-family: var(--font-heading);
  font-size: var(--text-title);
  font-weight: var(--weight-strong);
  line-height: var(--line-heading);
  overflow-wrap: anywhere;
}
h2 {
  font-size: var(--text-section);
  line-height: var(--line-heading);
}
p {
  max-width: var(--reading-width);
}
.skip {
  position: absolute;
  top: var(--space-2);
  left: var(--space-4);
  transform: translateY(-200%);
  z-index: var(--z-skip);
  background: var(--color-surface);
}
.skip:focus {
  transform: none;
}
.topbar {
  background: var(--color-surface);
  border-bottom: var(--line-thin) solid var(--color-line);
}
.topbar-inner {
  max-width: var(--content-width);
  min-height: var(--header-height);
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-6);
}
.brand {
  font-size: var(--text-section);
  font-weight: var(--weight-strong);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.brand-mark {
  border: var(--line-thin) solid var(--color-action);
  border-radius: var(--radius-control);
  padding: var(--space-1) var(--space-3);
  color: var(--color-action);
}
main {
  max-width: var(--content-width);
  margin: auto;
  padding: var(--space-7) var(--space-6) var(--space-8);
}
.intro {
  padding: var(--space-5) var(--space-0) var(--space-7);
  border-left: var(--line-accent) solid var(--color-action);
  padding-left: var(--space-5);
}
.intro p {
  color: var(--color-muted);
  margin-top: var(--space-4);
}
.context {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-5);
}
.pill {
  font-size: var(--text-small);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-pill);
  background: var(--color-soft);
  color: var(--color-action);
}
.panel {
  background: var(--color-surface);
  border: var(--line-thin) solid var(--color-line);
  border-radius: var(--radius-panel);
  overflow: hidden;
}
.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-5) var(--space-6);
  border-bottom: var(--line-thin) solid var(--color-line);
}
.muted {
  color: var(--color-muted);
  font-size: var(--text-small);
}
.table-scroll {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  text-align: left;
}
th {
  font-weight: var(--weight-medium);
  font-size: var(--text-small);
  color: var(--color-muted);
  background: var(--color-page);
}
th,
td {
  padding: var(--space-4) var(--space-6);
  border-bottom: var(--line-thin) solid var(--color-line);
  overflow-wrap: anywhere;
}
tbody tr:last-child td {
  border-bottom: none;
}
.member-name {
  font-weight: var(--weight-strong);
}
.self {
  margin-left: var(--space-3);
  font-size: var(--text-small);
  color: var(--color-muted);
}
.role {
  color: var(--color-success);
}
.notice {
  padding: var(--space-5) var(--space-6);
  display: grid;
  gap: var(--space-4);
}
.notice.warning {
  background: var(--color-warning-bg);
  color: var(--color-warning);
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-5);
}
.landing {
  padding: var(--space-7);
  display: grid;
  gap: var(--space-5);
}
.skeleton {
  min-height: var(--control-height);
  background: var(--color-soft);
  border-radius: var(--radius-control);
  margin: var(--space-4) var(--space-6);
}
.footnote {
  margin-top: var(--space-5);
  color: var(--color-muted);
  font-size: var(--text-small);
}
@media (max-width: 40rem) {
  .topbar-inner {
    padding: var(--space-3) var(--space-4);
    flex-wrap: wrap;
  }
  main {
    padding: var(--space-6) var(--space-4);
  }
  .intro {
    padding-bottom: var(--space-5);
  }
  .panel-heading,
  .notice,
  .landing {
    padding: var(--space-5);
  }
  th,
  td {
    padding: var(--space-3);
  }
  .self {
    display: block;
    margin-left: var(--space-0);
  }
}

.workspace-nav,
.terminal-actions,
.terminal-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}
.workspace-nav {
  margin-bottom: var(--space-5);
}
.workspace-nav button[aria-current="page"] {
  border-color: var(--color-action);
  background: var(--color-soft);
}
.terminal-heading {
  flex-wrap: wrap;
}
.terminal-list {
  display: grid;
  gap: var(--space-4);
  padding: var(--space-5);
}
.terminal-card {
  border: var(--line-thin) solid var(--color-line);
  border-radius: var(--radius-control);
  padding: var(--space-5);
  overflow-wrap: anywhere;
}
.terminal-title h3,
.terminal-facts dd {
  margin: var(--space-0);
}
.terminal-facts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4) var(--space-6);
  margin: var(--space-4) var(--space-0);
}
.terminal-facts dt {
  color: var(--color-muted);
  font-size: var(--text-small);
}
.terminal-capabilities {
  margin: var(--space-0);
  padding-left: var(--space-4);
}
.terminal-eligibility {
  display: block;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-control);
}
.terminal-dialog {
  color: var(--color-ink);
  max-width: min(var(--reading-width), calc(100% - var(--space-6)));
  padding: var(--space-0);
  overflow: auto;
}
.activation-code {
  border-radius: var(--radius-control);
  background: var(--color-soft);
  padding: var(--space-3);
  font-family: monospace;
  font-size: var(--text-section);
  overflow-wrap: anywhere;
  user-select: all;
}

.feature-section {
  margin-top: var(--space-5);
}
.action-link {
  display: inline-block;
  padding: var(--space-2) var(--space-5);
  border: var(--line-thin) solid var(--color-line);
  border-radius: var(--radius-control);
  color: var(--color-action);
  overflow-wrap: anywhere;
}

.contacts-table {
  min-width: var(--contacts-table-width);
}
</style></head><body><header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark">M</span>Maia</div><a href="wecom-onboarding.html">企业微信接入</a></div></header><main id="main"><section class="intro"><h1>内部联系人</h1><p>仅展示当前空间此企微实例允许访问的资料。联系人不自动成为 Maia 成员。</p></section><p class="footnote">合成数据原型，不证明官方姓名展示。<label>预览状态 <select id="state"><option value="ready">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">错误</option><option value="degraded">降级</option><option value="pending">范围待核对</option><option value="provider-retry">同步失败可重试</option><option value="forbidden">无权</option><option value="name-bound">官方组件已绑定</option><option value="name-loading">姓名准备中</option><option value="name-error">姓名加载失败</option><option value="name-expired">姓名授权过期</option><option value="name-configuration">登录授权未配置</option><option value="name-reload">姓名刷新恢复</option><option value="name-pending">姓名发起结果未知</option><option value="name-pending-blocked">姓名核对引用不可用</option></select></label></p><section class="panel feature-section"><div class="panel-heading"><h2>当前授权范围</h2><button id="refresh">刷新联系人</button></div><div id="view"></div><div id="names"></div></section><section id="sync" class="panel feature-section"></section></main><script>
const selector=document.getElementById('state'),view=document.getElementById('view'),sync=document.getElementById('sync'),names=document.getElementById('names');
const table='<div class="table-scroll" tabindex="0" role="region" aria-label="联系人资料，可横向滚动"><table class="contacts-table"><thead><tr><th>姓名展示</th><th>成员标识（来源命名空间）</th><th>职位</th><th>头像资料</th><th>访问状态与可信时间</th></tr></thead><tbody><tr><td>姓名暂不可展示</td><td>synthetic-member<br><span class="muted">wecom.open_userid</span></td><td>未获准</td><td>未返回</td><td>当前可访问<br><span class="muted">2026年11月15日 10:00</span></td></tr></tbody></table></div>';
function render(){const s=selector.value;view.innerHTML=s==='forbidden'?'<p class="notice warning" role="alert">当前无权读取此实例的联系人，请核对工作空间与权限。</p>':s==='loading'?'<p class="notice" role="status">正在核对联系人与当前权限…</p><div class="skeleton"></div>':s==='error'?'<p class="notice warning" role="alert">暂时无法读取联系人，已停止显示旧资料。请重试核对当前权限。</p>':(s==='pending'||s==='provider-retry')?'<div class="notice"><p role="status">授权范围待核对，当前空列表不代表全量为零。</p><p class="muted">最近可信时间：2026年11月15日 10:00</p></div>':s==='empty'?'<p class="notice">当前页暂无可展示的联系人。请核对同步覆盖，或刷新当前范围。</p>':'<p class="notice muted">最近可信时间：2026年11月15日 10:00 · 范围版本：1</p>'+table;names.innerHTML=['forbidden','empty','pending','provider-retry','loading','error'].includes(s)?'':'<div class="notice"><h2>姓名展示</h2><p role="status">'+(s==='name-pending'?'原姓名发起结果未知，请显式核对原请求；不会自动再次发送。':s==='name-pending-blocked'?'原姓名发起结果仍待核对，当前引用已过期、损坏或与账号/范围不符。放弃只清本地引用，不撤销服务端历史。':s==='name-bound'?'官方组件已绑定，实际姓名请本人核对；成员标识不能代表姓名。':s==='name-loading'?'正在准备官方姓名组件…':s==='name-configuration'?'普通浏览器姓名授权尚未配置，请联系管理员核对登录授权应用。':s==='name-expired'?'姓名授权已过期，请重新建立上下文。':s==='name-reload'?'请刷新页面后重新核对姓名展示。':s==='name-error'?'姓名展示未完成，请重新核对当前上下文与授权范围。':'姓名暂不可展示，可授权当前企业的姓名展示。')+'</p><div><button id="name-action" '+(s==='name-loading'||s==='name-configuration'||s==='name-pending-blocked'?'disabled':'')+'>'+(s.startsWith('name-pending')?'核对原姓名发起请求':s==='name-expired'?'重新建立姓名上下文':s==='name-reload'?'刷新页面恢复姓名展示':s==='name-bound'||s==='name-error'?'核对原姓名授权':'授权姓名展示')+'</button>'+(s.startsWith('name-pending')?'<button id="abandon-name">放弃本次姓名核验</button>':'')+'</div><p class="muted">姓名展示受限不改变联系人同步结果或实例归属。原型只模拟阶段，不呈现真人姓名。</p></div>';const nameTable=view.querySelector('.table-scroll');if(nameTable)nameTable.before(names);const abandonName=document.getElementById('abandon-name');if(abandonName)abandonName.onclick=()=>{selector.value='ready';render()};const nameAction=document.getElementById('name-action');if(nameAction)nameAction.onclick=()=>{selector.value='name-bound';render()};sync.innerHTML=s==='forbidden'?'':'<div class="panel-heading"><h2>联系人同步</h2></div><div class="notice"><h3>'+(s==='provider-retry'?'同步失败':s==='degraded'?'部分完成':'同步已完成')+'</h3><p>'+(s==='provider-retry'?'授权范围仍待核对，可补同步当前范围。':s==='degraded'?'覆盖不完整。上游资料暂不可用，当前覆盖仍有缺口。':'当前范围覆盖完整')+'</p><p class="muted">最近可信时间：2026年11月15日 10:00</p><div><button id="retry">补同步当前范围</button></div><p class="muted">同步、官方姓名展示、存档和终端条件分别核对。</p></div>';document.getElementById('refresh').disabled=s==='loading'||s==='forbidden';const retry=document.getElementById('retry');if(retry){retry.disabled=s==='pending'||s==='loading';retry.onclick=()=>{selector.value='ready';render()}}}
selector.onchange=render;document.getElementById('refresh').onclick=()=>{selector.value='ready';render()};render();</script></body></html>
