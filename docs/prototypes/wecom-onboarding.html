<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maia 企微接入 · 交互原型</title><style>:root {
  --color-page: #edf2f7;
  --color-surface: #ffffff;
  --color-ink: #182f48;
  --color-muted: #52677d;
  --color-line: #cedae6;
  --color-action: #164f8a;
  --color-action-hover: #103e6e;
  --color-soft: #e6eff8;
  --color-success: #236449;
  --color-warning: #795010;
  --color-warning-bg: #fff5df;
  --color-danger: #973d43;
  --font-body: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-heading: "Songti SC", "STSong", serif;
  --text-small: 0.875rem;
  --text-body: 1rem;
  --text-section: 1.25rem;
  --text-title: clamp(1.8rem, 4vw, 2.75rem);
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-strong: 650;
  --space-0: 0;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --space-8: 4rem;
  --radius-control: 0.375rem;
  --radius-panel: 0.75rem;
  --radius-pill: 2rem;
  --line-thin: 1px;
  --line-accent: 4px;
  --focus-width: 3px;
  --focus-offset: 3px;
  --contacts-table-width: 54rem;
  --content-width: 70rem;
  --reading-width: 42rem;
  --control-height: 2.75rem;
  --header-height: 5rem;
  --line-body: 1.7;
  --line-heading: 1.25;
  --opacity-muted: 0.6;
  --z-skip: 10;
}

* {
  box-sizing: border-box;
}
body {
  margin: var(--space-0);
  background: var(--color-page);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: var(--line-body);
}
button,
a {
  font: inherit;
}
button {
  min-height: var(--control-height);
  padding: var(--space-2) var(--space-5);
  border: var(--line-thin) solid var(--color-line);
  border-radius: var(--radius-control);
  background: var(--color-surface);
  color: var(--color-action);
  cursor: pointer;
  font-weight: var(--weight-medium);
}
button.primary {
  background: var(--color-action);
  border-color: var(--color-action);
  color: var(--color-surface);
}
button:hover:not(:disabled) {
  border-color: var(--color-action);
}
button.primary:hover:not(:disabled) {
  background: var(--color-action-hover);
}
button:disabled {
  opacity: var(--opacity-muted);
  cursor: wait;
}
:focus-visible {
  outline: var(--focus-width) solid var(--color-action);
  outline-offset: var(--focus-offset);
}
h1,
h2,
p {
  margin: var(--space-0);
}
h1 {
  font-family: var(--font-heading);
  font-size: var(--text-title);
  font-weight: var(--weight-strong);
  line-height: var(--line-heading);
  overflow-wrap: anywhere;
}
h2 {
  font-size: var(--text-section);
  line-height: var(--line-heading);
}
p {
  max-width: var(--reading-width);
}
.skip {
  position: absolute;
  top: var(--space-2);
  left: var(--space-4);
  transform: translateY(-200%);
  z-index: var(--z-skip);
  background: var(--color-surface);
}
.skip:focus {
  transform: none;
}
.topbar {
  background: var(--color-surface);
  border-bottom: var(--line-thin) solid var(--color-line);
}
.topbar-inner {
  max-width: var(--content-width);
  min-height: var(--header-height);
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-6);
}
.brand {
  font-size: var(--text-section);
  font-weight: var(--weight-strong);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.brand-mark {
  border: var(--line-thin) solid var(--color-action);
  border-radius: var(--radius-control);
  padding: var(--space-1) var(--space-3);
  color: var(--color-action);
}
main {
  max-width: var(--content-width);
  margin: auto;
  padding: var(--space-7) var(--space-6) var(--space-8);
}
.intro {
  padding: var(--space-5) var(--space-0) var(--space-7);
  border-left: var(--line-accent) solid var(--color-action);
  padding-left: var(--space-5);
}
.intro p {
  color: var(--color-muted);
  margin-top: var(--space-4);
}
.context {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-5);
}
.pill {
  font-size: var(--text-small);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-pill);
  background: var(--color-soft);
  color: var(--color-action);
}
.panel {
  background: var(--color-surface);
  border: var(--line-thin) solid var(--color-line);
  border-radius: var(--radius-panel);
  overflow: hidden;
}
.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-5) var(--space-6);
  border-bottom: var(--line-thin) solid var(--color-line);
}
.muted {
  color: var(--color-muted);
  font-size: var(--text-small);
}
.table-scroll {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  text-align: left;
}
th {
  font-weight: var(--weight-medium);
  font-size: var(--text-small);
  color: var(--color-muted);
  background: var(--color-page);
}
th,
td {
  padding: var(--space-4) var(--space-6);
  border-bottom: var(--line-thin) solid var(--color-line);
  overflow-wrap: anywhere;
}
tbody tr:last-child td {
  border-bottom: none;
}
.member-name {
  font-weight: var(--weight-strong);
}
.self {
  margin-left: var(--space-3);
  font-size: var(--text-small);
  color: var(--color-muted);
}
.role {
  color: var(--color-success);
}
.notice {
  padding: var(--space-5) var(--space-6);
  display: grid;
  gap: var(--space-4);
}
.notice.warning {
  background: var(--color-warning-bg);
  color: var(--color-warning);
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin-top: var(--space-5);
}
.landing {
  padding: var(--space-7);
  display: grid;
  gap: var(--space-5);
}
.skeleton {
  min-height: var(--control-height);
  background: var(--color-soft);
  border-radius: var(--radius-control);
  margin: var(--space-4) var(--space-6);
}
.footnote {
  margin-top: var(--space-5);
  color: var(--color-muted);
  font-size: var(--text-small);
}
@media (max-width: 40rem) {
  .topbar-inner {
    padding: var(--space-3) var(--space-4);
    flex-wrap: wrap;
  }
  main {
    padding: var(--space-6) var(--space-4);
  }
  .intro {
    padding-bottom: var(--space-5);
  }
  .panel-heading,
  .notice,
  .landing {
    padding: var(--space-5);
  }
  th,
  td {
    padding: var(--space-3);
  }
  .self {
    display: block;
    margin-left: var(--space-0);
  }
}

.workspace-nav,
.terminal-actions,
.terminal-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}
.workspace-nav {
  margin-bottom: var(--space-5);
}
.workspace-nav button[aria-current="page"] {
  border-color: var(--color-action);
  background: var(--color-soft);
}
.terminal-heading {
  flex-wrap: wrap;
}
.terminal-list {
  display: grid;
  gap: var(--space-4);
  padding: var(--space-5);
}
.terminal-card {
  border: var(--line-thin) solid var(--color-line);
  border-radius: var(--radius-control);
  padding: var(--space-5);
  overflow-wrap: anywhere;
}
.terminal-title h3,
.terminal-facts dd {
  margin: var(--space-0);
}
.terminal-facts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4) var(--space-6);
  margin: var(--space-4) var(--space-0);
}
.terminal-facts dt {
  color: var(--color-muted);
  font-size: var(--text-small);
}
.terminal-capabilities {
  margin: var(--space-0);
  padding-left: var(--space-4);
}
.terminal-eligibility {
  display: block;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-control);
}
.terminal-dialog {
  color: var(--color-ink);
  max-width: min(var(--reading-width), calc(100% - var(--space-6)));
  padding: var(--space-0);
  overflow: auto;
}
.activation-code {
  border-radius: var(--radius-control);
  background: var(--color-soft);
  padding: var(--space-3);
  font-family: monospace;
  font-size: var(--text-section);
  overflow-wrap: anywhere;
  user-select: all;
}

.feature-section {
  margin-top: var(--space-5);
}
.action-link {
  display: inline-block;
  padding: var(--space-2) var(--space-5);
  border: var(--line-thin) solid var(--color-line);
  border-radius: var(--radius-control);
  color: var(--color-action);
  overflow-wrap: anywhere;
}

.contacts-table {
  min-width: var(--contacts-table-width);
}
</style></head><body><header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark">M</span>Maia</div><a href="personal-workspace.html">个人工作空间</a></div></header><main id="main"><section class="intro"><h1>企业微信接入</h1><p>接入当前个人工作空间，按已核实的授权范围管理内部联系人。</p></section><p class="footnote">合成数据原型，不代表真实安装通过；复制按钮仅演示失败后的手工传递。<label>预览状态 <select id="state"><option value="ready">正常</option><option value="empty">空</option><option value="loading">加载</option><option value="error">错误</option><option value="degraded">降级</option><option value="forbidden">无权</option><option value="unknown">结果未知</option><option value="administrator">独立管理员身份核验</option><option value="recovery-source">已保存结果可恢复</option><option value="recovery-expired">本轮恢复过期</option><option value="source-expired">已保存结果不可核验</option><option value="copy-failed">复制失败</option><option value="recovery-unknown">核验发起结果未知</option></select></label></p><section class="panel feature-section"><div class="panel-heading"><h2>本次接入结果</h2></div><div id="operation" class="notice"></div></section><section class="panel feature-section"><div class="panel-heading"><h2>本空间企微实例</h2><button id="refresh">刷新实例</button></div><div id="instances"></div></section></main><script>
const selector=document.getElementById('state'),operation=document.getElementById('operation'),instances=document.getElementById('instances');
const card='<div class="terminal-list"><article class="terminal-card"><h3>企微实例 20</h3><dl class="terminal-facts"><div><dt>安装</dt><dd>可信绑定已完成</dd></div><div><dt>联系人同步</dt><dd>部分完成</dd></div><div><dt>会话存档</dt><dd>尚未开通</dd></div><div><dt>终端条件</dt><dd>尚未配置</dd></div><div><dt>授权范围</dt><dd>范围待核对</dd></div><div><dt>最近可信时间</dt><dd>2026年11月15日 10:00</dd></div></dl><p class="muted">此实例不代表已有可执行账号或 Tea 就绪。</p><div class="actions"><a class="action-link" href="contacts.html">查看内部联系人</a></div></article></div>';
function render(){const s=selector.value;operation.innerHTML=s==='empty'?'<p>接入只作用于当前个人工作空间。</p><div class="terminal-actions"><button data-start>成员扫码接入</button><button data-start>管理员接入</button></div>':s==='loading'?'<p role="status">正在核对本次接入…</p><div class="skeleton"></div>':s==='forbidden'?'<p role="alert">当前无权访问此企微接入，请核对工作空间与权限。</p>':s==='recovery-source'||s==='recovery-expired'?'<h3>接入操作已过期</h3><p>只重新核验管理员身份，不会重新安装。</p><div><button data-recover>'+ (s==='recovery-expired'?'重新核验管理员身份':'使用已保存结果重新核验管理员身份') +'</button><button data-query>查询原操作</button></div>':s==='source-expired'?'<h3>接入操作已过期</h3><p>已保存结果已不可核验，请重新取得可信授权。</p><button data-query>查询原操作</button>':s==='recovery-unknown'?'<p>结果待核实，请先核对原核验请求。</p><button data-query>核对原核验请求</button>':s==='administrator'||s==='copy-failed'?'<h3>接入待核对</h3><p>应用授权已收到，还需在本次操作中核验企业管理员身份。</p><div class="terminal-actions"><button data-copy>复制管理员身份核验链接</button><a class="action-link" href="https://synthetic.example/recovery-identity" target="_blank" rel="noopener noreferrer">核验管理员身份</a><button data-query>查询原操作</button></div><p>保留此电脑页面与当前 Maia 登录；把此链接交给本次企业管理员，在手机企业微信内打开完成身份核验，无需在手机登录 Maia。完成后回到此电脑查询原操作。</p>'+(s==='copy-failed'?'<p role="status">复制失败，请选择下方只读链接手工复制。</p><label>管理员身份核验链接（只读）<input readonly value="https://synthetic.example/recovery-identity"></label>':'')+'':s==='unknown'||s==='error'?'<h3>接入待核对</h3><p role="status">结果待核实，请查询原操作。</p><div><button data-query>查询原操作</button></div>':'<h3>可信绑定已完成</h3><p>可信安装绑定已完成。联系人覆盖、存档开通与终端接入需分别核对。</p><div><button data-query>查询原操作</button></div>';instances.innerHTML=s==='forbidden'?'':s==='loading'?'<div class="skeleton"></div>':s==='empty'?'<p class="notice">当前空间暂无企微实例。可从上方选择接入方式。</p>':s==='error'?'<p class="notice warning" role="alert">暂时无法读取企微实例，请重试。</p>':(s==='degraded'?'<p class="notice warning">暂时无法读取企微实例，当前保留上次读取的实例状态。</p>':'')+card;document.getElementById('refresh').disabled=s==='loading'||s==='forbidden';}
selector.onchange=render;document.getElementById('refresh').onclick=()=>{selector.value='ready';render()};operation.onclick=event=>{if(event.target.hasAttribute('data-start')){selector.value='unknown';render()}else if(event.target.hasAttribute('data-copy')){selector.value='copy-failed';render()}else if(event.target.hasAttribute('data-recover')){selector.value='administrator';render()}else if(event.target.hasAttribute('data-query')){selector.value='ready';render()}};render();</script></body></html>
